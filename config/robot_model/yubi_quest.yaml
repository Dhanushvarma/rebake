# Robot model for the quest_only rig (yubi-sw ROBOT_VARIANT=quest_only):
# a Meta Quest 3 worn on the head plus its Touch Plus controllers, no YUBI
# gloves, wrist cameras or footpedal. Derived from yubi.yaml; feature names
# are kept so datasets from both rigs line up.
#
# Notation: `{a, b}` expands to each variant (e.g. `quest_{left, right}_controller`
# means both `quest_left_controller` and `quest_right_controller`).
#
# Observations (states):
#   /tf_chain (each frame exposes transform / delta_transform / is_fresh)
#     - /quest_origin/quest_hmd                           : Quest HMD pose
#     - /quest_origin/quest_{left, right}_controller      : Quest controller pose
#     - /quest_origin/{left, right}_hand_root             : hand root pose
#     - /quest_origin/{left, right}_{left, right}_finger_tip_link
#                                                         : virtual finger tip pose
#                                                           (URDF fingers driven by the trigger)
#     - /left_hand_root/right_hand_root                   : right hand pose relative to left hand
#   /joint_states (each field exposes position / is_fresh)
#     - /position                                         : finger joint positions from the analog
#                                                           index triggers (0.94 open .. 0 closed)
#                                                           [left_right_finger_joint, right_right_finger_joint]
#     - /is_fresh                                         : freshness flag for the joint positions
#
#   For each pose above:
#     transform       -> absolute pose       [x, y, z, qx, qy, qz, qw]
#     delta_transform -> per-step delta pose [dx, dy, dz, dqx, dqy, dqz, dqw]
#     is_fresh        -> freshness flag for the absolute transform
#
# Observations (images):
#   /center_camera/image_raw/compressed                : Quest front passthrough camera (Video + /is_fresh)
#
# Actions:
#   /tf_chain            /quest_origin/quest_{left, right}_controller/delta_transform + is_fresh
#                                                      : controller delta action
#   /tf_chain            /quest_origin/{left, right}_hand_root/delta_transform + is_fresh
#                                                      : hand root delta action
#   /joint_states/action /position + is_fresh         : finger joint position action
#                                                        [left_right_finger_joint, right_right_finger_joint]
# Observations (states)
- type: Parquet
  topic: /tf_chain
  field: /quest_origin/quest_hmd/transform
  feature: observation.pose.hmd.absolute
  names: [x, y, z, qx, qy, qz, qw]
- type: Parquet
  topic: /tf_chain
  field: /quest_origin/quest_hmd/delta_transform
  feature: observation.pose.hmd.relative
  names: [dx, dy, dz, dqx, dqy, dqz, dqw]
- type: Parquet
  topic: /tf_chain
  field: /quest_origin/quest_hmd/is_fresh
  feature: observation.pose.hmd.absolute.is_fresh
- type: Parquet
  topic: /tf_chain
